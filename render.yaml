services:
  - type: worker
    name: kofe-i-kod-bot
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u bot.py"
    autoDeploy: "yes"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MANAGER_USERNAME
        sync: false
      - key: WELCOME_IMAGE_URL
        sync: false
