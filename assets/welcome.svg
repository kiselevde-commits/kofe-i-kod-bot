<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1c0d0b"/>
      <stop offset=".48" stop-color="#442019"/>
      <stop offset="1" stop-color="#160b0a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#a95730" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3a160f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chocolate" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5d4a1"/>
      <stop offset=".18" stop-color="#bd7a45"/>
      <stop offset=".42" stop-color="#71371f"/>
      <stop offset=".72" stop-color="#3c1b15"/>
      <stop offset=".9" stop-color="#8a4a2c"/>
      <stop offset="1" stop-color="#2b130f"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2=".15" y2="1">
      <stop stop-color="#fff8e8"/>
      <stop offset=".36" stop-color="#f6ddb0"/>
      <stop offset=".75" stop-color="#dfb67e"/>
      <stop offset="1" stop-color="#a96b45"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2=".85">
      <stop stop-color="#fff5df"/>
      <stop offset=".5" stop-color="#d9b88c"/>
      <stop offset="1" stop-color="#8d573e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
