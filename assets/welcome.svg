      <circle cx="58" cy="62" r=".8" fill="#f1bd84" opacity=".1"/>
      <circle cx="77" cy="21" r=".6" fill="#fff3d8" opacity=".1"/>
      <circle cx="28" cy="80" r=".7" fill="#e9ac77" opacity=".12"/>
    </pattern>
  </defs>

